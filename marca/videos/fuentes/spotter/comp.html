// ── la barra en el tiempo
function barY(t){
  let y=BAR_TOP;
  for(const [d0,d1,u0,u1] of REPS){
    if(t>=d0&&t<d1) return lerp(BAR_TOP,BAR_BOT,ease.cubicInOut(seg(t,d0,d1)));
    if(t>=d1&&t<u0) return BAR_BOT - (u0-d1>0.2 ? (Math.sin(t*57)*2.5+Math.sin(t*31)*1.5)*sstep(d1,d1+0.1,t) : 0);
    if(t>=u0&&t<u1) return lerp(BAR_BOT,BAR_TOP,ease.quadOut ? ease.cubicOut(seg(t,u0,u1)) : seg(t,u0,u1));
  }
  // la última subida no para: la barra se suelta y sale disparada hacia arriba
  const L=REPS[2]; if(t>=L[3]) return lerp(BAR_TOP,-260,ease.expoIn(seg(t,L[3]-0.02,BAR_GONE)));
  return y;
}
// esfuerzo 0..1 mientras baja la barra (para la cara)
function effort(t){ let e=0; for(const [d0,d1,u0,u1] of REPS){ e=Math.max(e,sstep(d0,d0+0.12,t)*(1-sstep(u0,u0+0.18,t))); } return e; }

// ── IK de dos segmentos: el codo sale hacia 'pref'
function ik(Sh,H,L,pref){ let dx=H.x-Sh.x, dy=H.y-Sh.y, d=Math.hypot(dx,dy); const dm=Math.min(d,2*L-0.5); const ux=dx/(d||1), uy=dy/(d||1);
  const mx=Sh.x+ux*dm/2, my=Sh.y+uy*dm/2, h=Math.sqrt(Math.max(0,L*L-(dm/2)*(dm/2))); let px=-uy, py=ux; if(px*pref.x+py*pref.y<0){px=-px;py=-py;}
  return {x:mx+px*h,y:my+py*h}; }
const limb=(a,e,b)=>`M${f1(a.x)},${f1(a.y)} Q${f1(e.x)},${f1(e.y)} ${f1(b.x)},${f1(b.y)}`;

// ── pose del personaje en coordenadas de PANTALLA (camara quieta en la sala correspondiente)
function pose(t){
  const P={x:960,y:PEEK_Y,rot:0,sx:1,sy:1,look:{x:0,y:0},blink:0,strain:0,hands:null,handsWorldFixed:false,legs:'stand',room:'A',armL:95,legT:0};
  if(t>=A0) return pose2(t);
  if(t<FLY0){
    // salta por encima de la palabra desde detrás, se queda un instante en el aire mirando a cámara y cae detrás
    const HID=CAP_TOP+330, APEX=CAP_TOP-318; P.x=JX; P.legs='stand';
    if(t<J_UP){ P.y=HID; }
    else if(t<J_TOP){ const u=seg(t,J_UP,J_TOP); P.y=lerp(HID,APEX,ease.cubicOut(u)); P.sy=1+0.16*(1-u); P.sx=1-0.1*(1-u); P.rot=-0.10*(1-u);
      P.legs='tuck'; P.legT=1-u; P.hands='up'; P.look={x:0,y:-0.8}; P.brow={l:0.9,r:0.9}; }
    else if(t<J_DOWN){ const u=seg(t,J_TOP,J_DOWN); P.y=APEX-10*Math.sin(u*Math.PI); P.hands='wave'; P.look={x:0,y:lerp(0.1,0.9,sstep(0.72,0.86,u))}; P.face=(t>J_TOP+0.18&&t<J_TOP+0.46)?'wink':(u>0.72?'o':'grin'); P.brow=u>0.72?{l:0.9,r:0.9}:{l:0.4,r:0.4}; }
    else { const u=seg(t,J_DOWN,J_GONE); P.y=lerp(APEX,HID,u*u*u); P.sy=1+0.14*u; P.sx=1-0.08*u; P.hands='up'; P.look={x:0,y:-0.9}; P.face='o'; P.brow={l:1,r:1}; }
    const im=OM.impact(t,J_TOP,{decay:9,omega:22,sqx:0.06,sqy:0.08}); if(t>=J_TOP&&t<J_DOWN){ P.sx*=im.sx; P.sy*=im.sy; }
    return P;
  }
  if(t<LAND){
    // lanzado: sale disparado desde detrás de la palabra y cae en el centro de la sala nueva, con una vuelta
    const u=seg(t,FLY0,LAND), k2=ease.cubicInOut(u), HID=CAP_TOP+330;
    P.x=lerp(JX,LAND_X+BX,k2); P.y=lerp(HID,STAND_Y,u)-4*520*u*(1-u);
    P.rot=-ease.cubicInOut(u)*Math.PI*2;
    const sp=Math.sin(u*Math.PI); P.sx=1-0.10*sp; P.sy=1+0.14*sp;
    P.hands='flail'; P.legs='tuck'; P.legT=sp; P.look={x:-0.6,y:-0.5}; P.room='A'; P.flail=u; P.face='o'; P.brow={l:1,r:1};
    return P;
  }
  if(t<CLIMB0){
    P.x=LAND_X; P.y=STAND_Y; const im=OM.impact(t,LAND,{decay:8,omega:24,sqx:0.18,sqy:0.22}); P.sx=im.sx; P.sy=im.sy;
    P.hands='side'; P.legs='stand'; P.look={x:lerp(-0.2,0.95,sstep(LAND+0.18,LAND+0.32,t)),y:lerp(0,-0.35,sstep(LAND+0.18,LAND+0.32,t))};
    P.blink=blinkAt(t,BLINK2); P.room='B';
    if(t<LAND+0.30){ P.face='o'; P.brow={l:1,r:1}; } else { P.face='smirk'; P.brow={l:-0.35,r:0.8}; }
    // se agacha antes de saltar
    const crouch=sstep(CLIMB0-0.2,CLIMB0,t); P.sy*=1-0.12*crouch; P.sx*=1+0.08*crouch; P.y+=18*crouch;
    return P;
  }
  if(t<SIT){
    const u=seg(t,CLIMB0,SIT), k2=ease.cubicInOut(u);
    P.x=lerp(LAND_X,SEAT.x,k2); P.y=lerp(STAND_Y,SEAT.y,k2)-Math.sin(k2*Math.PI)*170;
    P.rot=Math.sin(u*Math.PI)*0.16; const sp=Math.sin(u*Math.PI); P.sx=1-0.06*sp; P.sy=1+0.1*sp;
    P.hands='up'; P.legs='tuck'; P.legT=sp; P.look={x:0.5,y:-0.6}; P.room='B'; P.brow={l:0.7,r:0.7};
    return P;
  }
  // sentado en la máquina
  P.x=SEAT.x; P.y=SEAT.y; P.room='B'; P.legs='sit';
  const im=OM.impact(t,SIT,{decay:9,omega:26,sqx:0.12,sqy:0.14}); P.sx=im.sx; P.sy=im.sy;
  const e=effort(t); P.strain=e; P.sy*=1-0.05*e; P.sx*=1+0.03*e; P.y+=8*e;
  const L3=REPS[2]; if(t>L3[1]&&t<L3[2]){ P.x+=Math.sin(t*63)*2.2; P.rot+=Math.sin(t*47)*0.012; }
  const by=barY(t);
  if(t<LET_GO){
    const r=sstep(REACH0,REACH1,t);
    P.hands=[{x:lerp(868-40,960-GRIP,r),y:lerp(640,by+2,r)},{x:lerp(1052+40,960+GRIP,r),y:lerp(640,by+2,r)}];
    P.armL=lerp(110,178,r); P.handsWorldFixed=true;
  } else {
    // suelta: las manos se quedan arriba un instante y caen con muelle
    const d=spring(t-LET_GO-0.12,0.5,14);
    P.hands=[{x:lerp(960-GRIP,840,d),y:lerp(Math.max(by,BAR_TOP-40),300,d)},{x:lerp(960+GRIP,1080,d),y:lerp(Math.max(by,BAR_TOP-40),300,d)}]; P.armL=lerp(178,150,d);
  }
  P.look={x:0,y:lerp(-0.2,-1,sstep(LET_GO,LET_GO+0.12,t))};
  if(t<REACH1) P.look={x:0,y:-0.8};
  P.blink=blinkAt(t,6.95,0.12)*0;
  return P;
}
function pose2(t){
  const P={x:0,y:0,rot:0,sx:1,sy:1,look:{x:0,y:0},blink:0,strain:0,hands:'side',legs:'stand',room:'W',armL:95,legT:0,face:'grin',brow:null};
  const C=(x,y)=>({x:CO.x+x,y:CO.y+y}), D=(x,y)=>({x:DO.x+x,y:DO.y+y});
  const STC=C(740,625), ST1=D(640,930-120-306), ST2=D(980,930-240-306), ST3=D(1320,930-360-306), STE={x:EO.x+1180,y:CAP_E-306};

    P.sx=1-0.08*sp; P.sy=1+0.13*sp; P.legs='tuck'; P.legT=sp; P.hands='up'; P.rot=spin*ease.cubicInOut(u); P.brow={l:0.8,r:0.8}; };
  const land=(tl,k=1)=>{ const im=OM.impact(t,tl,{decay:8,omega:24,sqx:0.16*k,sqy:0.2*k}); P.sx*=im.sx; P.sy*=im.sy; };
  const crouch=(t0,t1)=>{ const c=sstep(t0,t1,t); P.sy*=1-0.13*c; P.sx*=1+0.08*c; P.y+=20*c; };
  if(t<CH0){ at(C(-400,625)); return P; }
  if(t<CH1){ hopTo(CH0,CH1,C(-260,625),STC,240); P.look={x:0.7,y:-0.3}; return P; }
  if(t<GRAB0){ at(STC); land(CH1);
    if(t<SMIRK){ P.face='o'; P.brow={l:1,r:1}; P.look={x:0.75,y:-1}; }                         // mira la torre: "uf"
    else { P.face='smirk'; P.brow={l:-0.35,r:0.9}; P.look={x:0.1,y:0.05}; }                    // mira a cámara: "tranquilo"
    crouch(GRAB0-0.17,GRAB0); return P; }
  if(t<TOSS0){ at(STC); const tb=towerBase(t);
    P.hands=[{x:tb.x-120,y:tb.y+8},{x:tb.x+120,y:tb.y+8}]; P.armL=132;
    if(t<POP){ const q=sstep(GRAB0,GRAB1,t); P.sy=1-0.17*q; P.sx=1+0.1*q; P.y+=24*q; P.strain=1; P.face='strain';
      if(t>GRAB1){ P.x+=Math.sin(t*61)*2.6; P.rot=Math.sin(t*43)*0.016; } }
    else { const q=OM.impact(t,POP,{decay:7,omega:20,sqx:-0.10,sqy:-0.14}); P.sx=q.sx; P.sy=q.sy;
      P.face=(t>WINK0&&t<WINK1)?'wink':'grin'; P.brow=(t>WINK0&&t<WINK1)?{l:0.6,r:-0.4}:{l:0.5,r:0.5}; }
    return P; }
  if(t<LEAP0){ at(STC); const tb=towerBase(t);
    if(t<TOSS_REL+0.04){ P.hands=[{x:tb.x-120,y:tb.y+8},{x:tb.x+120,y:tb.y+8}]; P.armL=132; P.rot=-0.10*sstep(TOSS0,TOSS0+0.12,t)+0.34*sstep(TOSS_REL-0.1,TOSS_REL,t); P.face='grin'; P.brow={l:0.8,r:0.8}; }
    else { P.rot=0.34*(1-sstep(TOSS_REL,TOSS_REL+0.3,t)); P.hands=t<TOSS_REL+0.25?'up':'side'; P.face='smirk'; P.brow={l:-0.3,r:0.9}; P.look={x:1,y:-0.5}; }
    crouch(LEAP0-0.14,LEAP0); return P; }
  if(t<S1){ hopTo(LEAP0,S1,STC,ST1,380,-Math.PI*2); P.hands='flail'; P.face='grin'; P.look={x:0.8,y:0}; return P; }
  if(t<HOP2[0]){ at(ST1); land(S1); P.look={x:0.8,y:-0.6}; P.brow={l:0.7,r:0.7}; crouch(HOP2[0]-0.12,HOP2[0]); return P; }
  if(t<HOP2[1]){ hopTo(HOP2[0],HOP2[1],ST1,ST2,150); P.look={x:0.7,y:-0.2}; return P; }

  if(t<HOP3[1]){ hopTo(HOP3[0],HOP3[1],ST2,ST3,150); P.look={x:0.6,y:-0.2}; return P; }

    P.rot=-Math.PI*2*ease.cubicInOut(u); const sp=Math.sin(u*Math.PI); P.sx=1-0.1*sp; P.sy=1+0.16*sp; P.legs='tuck'; P.legT=sp; P.hands='up'; P.face='grin'; P.brow={l:1,r:1}; return P; }
  at(STE); land(JE1,1.2);
  P.hands=t<JE1+0.3?'up':'hips'; P.look={x:0,y:0};
  if(t<19.7){ P.face='grin'; P.brow={l:0.8,r:0.8}; } else if(t<20.0){ P.face='smirk'; P.brow={l:-0.3,r:0.9}; }
  else if(t<20.3){ P.face='wink'; P.brow={l:0.6,r:-0.4}; } else { P.face='smirk'; P.brow={l:-0.2,r:0.6}; }
  return P;
}
// la torre de tareas: base (centro inferior) y giro, en el mundo
function towerBase(t){
  const C=(x,y)=>({x:CO.x+x,y:CO.y+y});
  if(t<GRAB0) return {...C(1200,930),a:0};
  if(t<GRAB1){ const h=OM.hop(t,GRAB0,GRAB1,C(1200,930),C(740,510),{height:120,curve:ease.cubicInOut}); return {x:h.x,y:h.y,a:-0.12*Math.sin(seg(t,GRAB0,GRAB1)*Math.PI)}; }
  if(t<POP){ const b=C(740,510); return {x:b.x+Math.sin(t*61)*2.6,y:b.y+Math.sin(t*47)*2,a:Math.sin(t*39)*0.02}; }
  if(t<TOSS0){ const k=spring(t-POP,0.45,16); const b=C(740,lerp(510,395,k)); return {x:b.x,y:b.y,a:0}; }
  if(t<TOSS_REL){ const k=sstep(TOSS0,TOSS_REL,t); const b=C(740-30*k,395+20*k); return {x:b.x,y:b.y,a:-0.08*k}; }
  const u=seg(t,TOSS_REL,TOSS_REL+0.75); const b=C(710+2600*u, 415-1500*u+300*u*u); return {x:b.x,y:b.y,a:-0.08+2.6*u};
}
function posW(t){ const Q=pose(t); return (Q.room==='B'&&t>=LAND)?{x:Q.x+BX,y:Q.y}:{x:Q.x,y:Q.y}; }
function vel(t,lag,dt){ if(t-lag-dt<0) return {x:0,y:0}; const a=posW(t-lag), b=posW(t-lag-dt); const v={x:(a.x-b.x)/dt,y:(a.y-b.y)/dt}; return Math.hypot(v.x,v.y)>6000?{x:0,y:0}:v; }
function blinkAt(t,t0,d=0.14){ const u=seg(t,t0,t0+d); return u>0&&u<1?Math.sin(u*Math.PI):0; }

const HITS=[[J_GONE,6,10],[LAND,16,8],[SIT,7,10],[LET_GO+0.06,9,9],...TD.map((x,i)=>[x,4+2*i,10]),[CH1,9,9],[POP,7,10],...SD.map(x=>[x,4,11]),[S1,7,9],[HOP2[1],5,10],[HOP3[1],6,10],[JE1,15,8]];

const handEnv=t=>{ let e=sstep(0.1,0.5,t); for(const [a,b] of HOLDS) e*=1-sstep(a-0.15,a,t)*(1-sstep(b,b+0.2,t)); return e; };
function camAt(t){
  const c=OM.camera(t,KEYS), e=handEnv(t)*5;
  let x=c.x+e*(Math.sin(1.7*t)+0.6*Math.sin(2.9*t+1))/c.zoom, y=c.y+e*(Math.sin(1.3*t+2)+0.5*Math.sin(3.3*t))/c.zoom, rot=c.rot;

  return {x,y,zoom:c.zoom,rot};
}
